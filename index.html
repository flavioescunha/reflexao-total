<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lição interativa sobre Reflexão Total - Física para Ensino Médio">
    <title>Reflexão Total — Lição Interativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #050a18;
            --bg-dark: #0a1628;
            --surface: rgba(15, 30, 60, 0.6);
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00e5ff;
            --accent-blue: #2979ff;
            --accent-purple: #7c4dff;
            --accent-amber: #ffab00;
            --text-primary: #e8eaf6;
            --text-secondary: #90a4ae;
            --text-muted: #546e7a;
            --glow-cyan: 0 0 30px rgba(0, 229, 255, 0.3);
            --glow-blue: 0 0 40px rgba(41, 121, 255, 0.2);
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========== ANIMATED BACKGROUND ========== */
        .bg-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        /* Gradient orbs */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        .bg-orb--1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent-cyan), transparent 70%);
            top: -10%; left: -5%;
            animation-duration: 14s;
        }
        .bg-orb--2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--accent-purple), transparent 70%);
            bottom: -10%; right: -5%;
            animation-duration: 18s;
            animation-delay: -4s;
        }
        .bg-orb--3 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, var(--accent-blue), transparent 70%);
            top: 40%; left: 50%;
            animation-duration: 16s;
            animation-delay: -8s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.1); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* Light ray animation on canvas */
        #lightCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Grid overlay */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 2;
        }

        /* ========== MAIN CONTAINER ========== */
        .cover {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 560px;
            padding: 2rem;
        }

        .cover__card {
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2.5rem 2.5rem;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 4px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .cover__card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent,
                var(--accent-cyan),
                var(--accent-blue),
                var(--accent-purple),
                transparent
            );
            opacity: 0.7;
        }

        /* ========== HEADER ========== */
        .cover__badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 100px;
            padding: 6px 14px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent-cyan);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }
        .cover__badge::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .cover__title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 50%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cover__subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* ========== PRISM ICON ========== */
        .cover__prism {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .prism-svg {
            width: 180px;
            height: 120px;
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.3));
        }

        .prism-body {
            fill: rgba(0, 229, 255, 0.06);
            stroke: var(--accent-cyan);
            stroke-width: 1.5;
        }

        .prism-ray-in {
            stroke: #fff;
            stroke-width: 2;
            stroke-dasharray: 6 4;
            animation: rayMove 1.5s linear infinite;
        }

        .prism-ray-out {
            stroke-width: 2;
            stroke-dasharray: 6 4;
            animation: rayMove 1.5s linear infinite;
        }

        @keyframes rayMove {
            to { stroke-dashoffset: -20; }
        }

        /* ========== FORM ========== */
        .cover__form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .field {
            position: relative;
        }

        .field__input {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 16px 18px 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            caret-color: var(--accent-cyan);
        }

        .field__input::placeholder {
            color: transparent;
        }

        .field__label {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .field__input:focus,
        .field__input:not(:placeholder-shown) {
            border-color: rgba(0, 229, 255, 0.3);
            background: rgba(0, 229, 255, 0.03);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.06);
        }

        .field__input:focus + .field__label,
        .field__input:not(:placeholder-shown) + .field__label {
            top: 10px;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--accent-cyan);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .field__input:focus + .field__label {
            color: var(--accent-cyan);
        }

        .field__row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .field__error {
            font-size: 0.75rem;
            color: #ff5252;
            margin-top: 4px;
            padding-left: 4px;
            display: none;
        }

        .field--error .field__input {
            border-color: rgba(255, 82, 82, 0.4);
            box-shadow: 0 0 0 3px rgba(255, 82, 82, 0.06);
        }

        .field--error .field__error {
            display: block;
        }

        /* ========== BUTTON ========== */
        .cover__btn {
            margin-top: 0.5rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.25);
            transition: all 0.3s ease;
        }

        .cover__btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 229, 255, 0.35);
        }

        .cover__btn:active {
            transform: translateY(0);
        }

        .cover__btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .cover__btn:hover::after {
            transform: translateX(100%);
        }

        .cover__btn-icon {
            display: flex;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .cover__btn:hover .cover__btn-icon {
            transform: translateX(4px);
        }

        /* ========== FOOTER ========== */
        .cover__footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .cover__footer svg {
            opacity: 0.4;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            .cover {
                padding: 1rem;
            }
            .cover__card {
                padding: 2rem 1.5rem 1.5rem;
                border-radius: 18px;
            }
            .cover__title {
                font-size: 1.8rem;
            }
            .field__row {
                grid-template-columns: 1fr;
            }
        }

        /* ========== ANIMATIONS ========== */
        .cover__card {
            animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .cover__badge { animation: fadeUp 0.6s 0.2s ease both; }
        .cover__title { animation: fadeUp 0.6s 0.3s ease both; }
        .cover__subtitle { animation: fadeUp 0.6s 0.4s ease both; }
        .cover__prism { animation: fadeUp 0.6s 0.5s ease both; }
        .cover__form .field:nth-child(1) { animation: fadeUp 0.5s 0.6s ease both; }
        .cover__form .field:nth-child(2) { animation: fadeUp 0.5s 0.7s ease both; }
        .cover__btn { animation: fadeUp 0.5s 0.8s ease both; }
        .cover__footer { animation: fadeUp 0.5s 0.9s ease both; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- Animated Background -->
<div class="bg-scene">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
    <canvas id="lightCanvas"></canvas>
    <div class="bg-grid"></div>
</div>

<!-- Main Cover Card -->
<main class="cover">
    <div class="cover__card">

        <span class="cover__badge">Física — Óptica</span>

        <h1 class="cover__title">Reflexão Total</h1>
        <p class="cover__subtitle">
            Uma lição interativa sobre o fenômeno da reflexão total
            interna e suas aplicações.
        </p>

        <!-- Image illustration -->
        <div class="cover__prism">
            <img src="reflexao_cachorro.jpg" alt="Reflexão Total" style="width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 229, 255, 0.25); max-width: 250px; display: block; margin: 0 auto;" />
        </div>

        <!-- Form -->
        <form class="cover__form" id="coverForm" novalidate>
            <div class="field" id="fieldNome">
                <input
                    class="field__input"
                    type="text"
                    id="inputNome"
                    placeholder=" "
                    autocomplete="off"
                    required
                >
                <label class="field__label" for="inputNome">Seu nome completo</label>
                <span class="field__error">Por favor, insira seu nome.</span>
            </div>

            <div class="field__row">
                <div class="field" id="fieldNumero">
                    <input
                        class="field__input"
                        type="text"
                        id="inputNumero"
                        placeholder=" "
                        autocomplete="off"
                        inputmode="numeric"
                        required
                    >
                    <label class="field__label" for="inputNumero">Número</label>
                    <span class="field__error">Insira o número.</span>
                </div>

                <div class="field" id="fieldTurma">
                    <input
                        class="field__input"
                        type="text"
                        id="inputTurma"
                        placeholder=" "
                        autocomplete="off"
                        required
                    >
                    <label class="field__label" for="inputTurma">Turma</label>
                    <span class="field__error">Insira a turma.</span>
                </div>
            </div>

            <button class="cover__btn" type="submit" id="btnStart">
                <span>Iniciar lição</span>
                <span class="cover__btn-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </span>
            </button>
        </form>

        <div class="cover__footer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 16v-4"/>
                <path d="M12 8h.01"/>
            </svg>
            <span>Seus dados serão salvos para o certificado de conclusão.<br><br>
            Produzido por Prof. Flávio da Cunha | <a href="mailto:flavioescunha@gmail.com" style="color: var(--accent-cyan); text-decoration: none;">flavioescunha@gmail.com</a></span>
        </div>
    </div>
</main>

<script>
    // ========== BACKGROUND LIGHT RAYS ==========
    const canvas = document.getElementById('lightCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let rays = [];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    class LightRay {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * width;
            this.y = -20;
            this.angle = (Math.random() * 40 + 70) * Math.PI / 180; // mostly downward
            this.speed = Math.random() * 1.5 + 0.5;
            this.length = Math.random() * 80 + 40;
            this.opacity = Math.random() * 0.06 + 0.02;
            this.hue = Math.random() > 0.5 ? 190 : 220; // cyan or blue
        }
        update() {
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            if (this.y > height + 50) this.reset();
        }
        draw() {
            const endX = this.x + Math.cos(this.angle) * this.length;
            const endY = this.y + Math.sin(this.angle) * this.length;
            const grad = ctx.createLinearGradient(this.x, this.y, endX, endY);
            grad.addColorStop(0, `hsla(${this.hue}, 100%, 70%, 0)`);
            grad.addColorStop(0.5, `hsla(${this.hue}, 100%, 70%, ${this.opacity})`);
            grad.addColorStop(1, `hsla(${this.hue}, 100%, 70%, 0)`);
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    function initRays() {
        rays = [];
        const count = Math.floor(width / 25);
        for (let i = 0; i < count; i++) {
            rays.push(new LightRay());
        }
    }

    function animateBg() {
        ctx.clearRect(0, 0, width, height);
        rays.forEach(r => { r.update(); r.draw(); });
        requestAnimationFrame(animateBg);
    }

    window.addEventListener('resize', () => { resize(); initRays(); });
    resize();
    initRays();
    animateBg();


    // ========== FORM LOGIC ==========
    const form = document.getElementById('coverForm');
    const inputNome = document.getElementById('inputNome');
    const inputNumero = document.getElementById('inputNumero');
    const inputTurma = document.getElementById('inputTurma');

    function validateField(input, fieldId) {
        const field = document.getElementById(fieldId);
        if (!input.value.trim()) {
            field.classList.add('field--error');
            return false;
        }
        field.classList.remove('field--error');
        return true;
    }

    // Remove error on input
    [inputNome, inputNumero, inputTurma].forEach(input => {
        input.addEventListener('input', () => {
            input.closest('.field').classList.remove('field--error');
        });
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const v1 = validateField(inputNome, 'fieldNome');
        const v2 = validateField(inputNumero, 'fieldNumero');
        const v3 = validateField(inputTurma, 'fieldTurma');

        if (v1 && v2 && v3) {
            // Save student data to localStorage
            const studentData = {
                nome: inputNome.value.trim(),
                numero: inputNumero.value.trim(),
                turma: inputTurma.value.trim(),
                dataInicio: new Date().toISOString()
            };
            localStorage.setItem('reflexaoTotal_aluno', JSON.stringify(studentData));

            // Navigate to the first lesson page
            const btn = document.getElementById('btnStart');
            btn.style.pointerEvents = 'none';

            // Redirect after a brief delay
            setTimeout(() => { window.location.href = 'pagina2.html'; }, 800);
        }
    });
</script>

</body>
</html>
